<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QOT Muhasebe</title>
<style>
:root,[data-theme=mavi]{--bg:#edf1f5;--card:#fff;--tx:#14202b;--mu:#5f6e7c;--bd:#d3dbe3;--ac:#1f5f8b;--rd:#b8362a;--gr:#1b7f46;--ye:#fff4d6}
[data-theme=koyu]{--bg:#1e1f22;--card:#2a2b2f;--tx:#e8e8ea;--mu:#9a9aa0;--bd:#3f4045;--ac:#6ea8e0;--rd:#f0786a;--gr:#4cc47f;--ye:#3a3320}
[data-theme=beyaz]{--bg:#fff;--card:#fff;--tx:#202124;--mu:#5f6368;--bd:#dadce0;--ac:#1a73e8;--rd:#d93025;--gr:#188038;--ye:#fef7e0}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
header b{font-size:17px}
nav{display:flex;gap:4px;padding:8px 14px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{display:flex;align-items:center;gap:6px;white-space:nowrap;border:0;background:none;color:var(--mu);padding:8px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}
.big{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.mu{color:var(--mu)}.rd{color:var(--rd)}.gr{color:var(--gr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 130px}
input,select,button.b{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
button.b{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:9px 14px}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);cursor:pointer;border-radius:4px;padding:3px 8px;font:inherit;font-size:13px}
table input{padding:5px;width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid var(--bd);cursor:pointer;background:none;color:inherit;font-family:inherit}
.chip.ok{background:var(--gr);color:#fff;border-color:var(--gr)}
.chip.no{border-color:var(--rd);color:var(--rd)}
.warn{background:var(--ye);padding:8px 10px;border-radius:4px;margin-bottom:10px}
#login{text-align:center;padding:80px 20px}
.hide{display:none!important}
.cs{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);cursor:pointer;padding:0}
.cs.sel{outline:3px solid var(--ac);outline-offset:2px}
.mh td{background:var(--bg);font-weight:600;padding-top:14px}
details{background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .15s;align-self:center;margin:-3px 2px 0 0}
details[open]>summary::before{transform:rotate(225deg);margin-top:3px}
.ic{width:18px;height:18px}
.cr{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.cr>.mu{flex:0 0 190px}.cv{flex:1;word-break:break-all;font-variant-numeric:tabular-nums;min-width:140px}
.cp{display:inline-flex;align-items:center;padding:4px 7px}.cp .ic{width:15px;height:15px}
details>div{padding:0 14px 12px;overflow-x:auto}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--bd);vertical-align:-1px;margin-right:6px}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem("qotTheme")||"mavi"}catch(e){}</script></head><body>
<div id="login"><h1>QOT Muhasebe</h1><p class="mu">Devam etmek için ortak hesabınla giriş yap.</p><button class="b" id="in">Google ile giriş yap</button><p id="err" class="rd"></p></div>
<div id="app" class="hide">
<header><b>QOT Muhasebe</b><span><span class="mu" id="who"></span> <button class="g" id="out">Çıkış</button></span></header>
<nav id="nav"></nav><main id="main"></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,doc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const P=["Berk","Melisa","Dolunay"];
const app=initializeApp({apiKey:"AIzaSyDM-omizP0xpXpKLD36TAUBnD-A751IFQg",authDomain:"qot-muhendislik.firebaseapp.com",projectId:"qot-muhendislik",storageBucket:"qot-muhendislik.firebasestorage.app",messagingSenderId:"340312127032",appId:"1:340312127032:web:54873b2d0eac858955d8cd"});
const auth=getAuth(app),db=getFirestore(app);
const COLS=["expenses","movements","txns","filaments","colors","ftypes","products","statements","planned","materials"];
const S={expenses:[],movements:[],txns:[],filaments:[],colors:[],ftypes:[],products:[],statements:[],planned:[],materials:[],company:[]};
let editC=false;const shown={};
const DEF=[["Siyah","#1a1a1a"],["Beyaz","#f2f2f2"],["Gri","#8a8d91"],["Kırmızı","#d32f2f"],["Turuncu","#f57c00"],["Sarı","#fbc02d"],["Yeşil","#2e9e4f"],["Mavi","#1e66d0"],["Lacivert","#16306b"],["Mor","#7b3fa0"],["Pembe","#e86fa5"],["Kahverengi","#6d4c3d"],["Şeffaf","#cfe8ef"],["Altın","#c9a227"]].map(([name,hex])=>({name,hex}));
let selC=null;const monthOpen={};
let theme="mavi";try{theme=localStorage.getItem("qotTheme")||"mavi"}catch{}
const DEFT=["PLA","PETG","ABS","ASA","TPU","Diğer"],types=()=>[...DEFT,...S.ftypes.map(t=>t.name)];
const ic=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={kasa:ic('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M12 17v-1.5M8.5 12H7M17 12h-1.5"/>'),
exp:ic('<path d="M7 4v14M3 14l4 4 4-4"/><path d="M17 20V6M13 10l4-4 4 4"/>'),
fil:ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>'),
set:ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
pln:ic('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
prd:ic('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
cmp:ic('<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>'),
bak:ic('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/>')};
const lib=()=>[...DEF,...S.colors];
let tab="kasa",month=new Date().toISOString().slice(0,7),started=false;
const TABS={kasa:"Kasa",exp:"Gelir / Gider",pln:"Gelecek ödemeler",fil:"Filament",prd:"Ürünler",cmp:"Şirket",set:"Ayarlar",bak:"Yedek"};
const $=s=>document.querySelector(s),today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>document.getElementById(id)?.value.trim();
const num=id=>parseFloat((val(id)||"").replace(",","."))||0;
const round=n=>Math.round(n*100)/100;

$("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("#err").textContent="Giriş yapılamadı: "+e.code);
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  $("#login").classList.toggle("hide",!!u);$("#app").classList.toggle("hide",!u);
  if(!u)return;$("#who").textContent=u.displayName||u.email;
  if(started)return;started=true;
  [...COLS,"company"].forEach(c=>onSnapshot(collection(db,c),s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    e=>{$("#main").innerHTML='<div class="warn">Veri okunamadı ('+esc(e.code)+'). Bu e-posta Firestore kurallarındaki listede olmayabilir.</div>'}));
});

const balance=()=>S.movements.reduce((a,m)=>a+(m.type==="in"?m.amount:-m.amount),0);
const pending=()=>[...S.expenses,...S.statements].reduce((a,x)=>a+P.reduce((b,p)=>b+(x.shares?.[p]&&!x.shares[p].paid?x.shares[p].amount:0),0),0);
const cardPend=()=>S.expenses.filter(e=>e.pay==="card"&&!e.statementId);
const earmarked=()=>S.planned.filter(x=>!x.paid).reduce((a,x)=>a+P.reduce((b,p)=>b+(x.shares?.[p]?.paid?x.shares[p].amount:0),0),0);
const free=()=>balance()+pending()-earmarked();
const addM=ds=>{const [y,m,d]=ds.split("-").map(Number),n=new Date(y,m,1),last=new Date(y,m+1,0).getDate();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0")};

function render(){
  $("#nav").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?"on":""}" data-a="tab" data-k="${k}">${IC[k]}${v}</button>`).join("");
  $("#main").innerHTML={kasa:vKasa,exp:vExp,pln:vPln,fil:vFil,prd:vPrd,cmp:vCmp,set:vSet,bak:vBak}[tab]();
}

function vKasa(){
  const b=balance(),pe=pending();
  const mv=[...S.movements].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||0);
  return `<div class="card"><div class="mu">Kasa bakiyesi</div><div class="big ${b<0?"rd":""}">${fmt(b)}</div>
  <div class="mu">Ortaklardan beklenen: ${fmt(pe)} · Beklenenler gelince: ${fmt(b+pe)}${cardPend().length?` · Ekstrede bekleyen kart harcaması: ${fmt(cardPend().reduce((a,e)=>a+e.total,0))}`:""}${earmarked()>0?` · Planlı ödemeler için ayrılan: ${fmt(earmarked())}`:""}</div></div>
  <div class="card"><h2>Kasaya para yatır</h2><div class="row">
  <label>Ortak<select id="dp">${P.map(p=>`<option>${p}</option>`).join("")}</select></label>
  <label>Tutar<input id="da" inputmode="decimal"></label><label>Not<input id="dn"></label>
  <button class="b" data-a="dep">Yatır</button></div></div>
  <div class="card"><h2>Kasa hareketleri</h2>${mv.length?`<table><tr><th>Tarih<th>Açıklama<th class="n">Tutar</tr>${mv.map(m=>`<tr><td>${esc(m.date)}<td>${m.type==="in"?esc(m.partner||"")+" · ":""}${esc(m.note)}<td class="n ${m.type==="in"?"gr":"rd"}">${m.type==="in"?"+":"−"}${fmt(m.amount)}</tr>`).join("")}</table>`:'<p class="mu">Henüz hareket yok. Yukarıdan ilk yatırımı gir.</p>'}</div>`;
}

function vExp(){
  const mn=m=>m?new Date(m+"-01").toLocaleDateString("tr-TR",{month:"long",year:"numeric"}):"Tarihsiz";
  const cm=today().slice(0,7);
  const pend=x=>P.reduce((b,p)=>b+(x.shares?.[p]&&!x.shares[p].paid?x.shares[p].amount:0),0);
  const items=[...S.expenses.map(e=>({k:"e",d:e.date||"",e})),...S.txns.map(t=>({k:"t",d:t.date||"",t})),...S.statements.map(st=>({k:"s",d:st.date||"",st}))].map(i=>({...i,m:i.d.slice(0,7)})).sort((a,b)=>b.d.localeCompare(a.d));
  const months=[...new Set([cm,...items.map(i=>i.m)])].sort().reverse();
  const avail=Math.max(0,free());
  const row=i=>{
    if(i.k==="t"){const t=i.t,inc=t.type==="income";
      return `<tr><td>${esc(t.date)}<td><b>${esc(t.category)}</b><br><span class="mu">${esc(t.note)}</span><td class="n ${inc?"gr":"rd"}">${inc?"+":"−"}${fmt(t.amount)}<td class="n mu">—<td colspan="3" class="mu">${inc?"Gelir":"Gider"}<td><button class="g" data-a="delInc" data-id="${t.id}">Sil</button></tr>`}
    if(i.k==="s"){const st=i.st;return `<tr><td>${esc(st.date)}<td><b>Kredi kartı ekstresi</b><br><span class="mu">${st.count||0} harcama · gider olarak zaten sayıldı</span><td class="n mu">${fmt(st.total)}<td class="n">${fmt(st.fromKasa)}${P.map(p=>{const s=st.shares?.[p];return s&&s.amount>0?`<td><button class="chip ${s.paid?"ok":"no"}" data-a="payS" data-id="${st.id}" data-p="${p}">${s.paid?"Ödendi":"Bekliyor"}</button><br><span class="mu">${fmt(s.amount)}</span>`:'<td class="mu">—'}).join("")}<td><button class="g" data-a="delSt" data-id="${st.id}">Sil</button></tr>`}
    const e=i.e;
    return `<tr><td>${esc(e.date)}<td><b>${esc(e.institution)}</b><br><span class="mu">${esc(e.description)}</span><br>${e.receipt?`<a href="${esc(e.receipt)}" target="_blank" rel="noopener">Dekont</a> <button class="g" data-a="rcp" data-id="${e.id}">Değiştir</button>`:`<button class="g" data-a="rcp" data-id="${e.id}">+ Dekont ekle</button>`}
    <td class="n rd">−${fmt(e.total)}<td class="n">${e.pay==="card"?"—":fmt(e.fromKasa)}
    ${e.pay==="card"||e.pay==="planned"?`<td colspan="3" class="mu">${e.pay==="planned"?"Planlı ödeme · kasadan ödendi":`Kredi kartı · ${e.statementId?"ekstreye işlendi":"ekstrede bekliyor"}`}</td>`:P.map(p=>{const s=e.shares?.[p];return s&&s.amount>0?`<td><button class="chip ${s.paid?"ok":"no"}" data-a="pay" data-id="${e.id}" data-p="${p}">${s.paid?"Ödendi":"Bekliyor"}</button><br><span class="mu">${fmt(s.amount)}</span>`:'<td class="mu">—'}).join("")}
    <td><button class="g" data-a="delExp" data-id="${e.id}">Sil</button></tr>`};
  const cpl=cardPend(),cp=cpl.reduce((a,e)=>a+e.total,0),fk=Math.min(avail,cp),rest=cp-fk;
  const cardPanel=`<div class="card"><h2>Kredi kartı ekstresi</h2><p>Ekstreye girmemiş harcamalar: <b>${fmt(cp)}</b> (${cpl.length} kalem). Şimdi ekstre kesilse: kasadan <b>${fmt(fk)}</b>, eksik <b>${fmt(rest)}</b>, kişi başı <b>${fmt(rest/3)}</b>.</p>
  <div class="row"><label>Ekstre tutarı (TL)<input id="st" value="${cp||""}" inputmode="decimal"></label><label>Ödeme tarihi<input id="sd" type="date" value="${today()}"></label><button class="b" data-a="closeSt">Ekstreyi öde</button></div>
  <p class="mu">Gerçek ekstre tutarı farklıysa (faiz, taksit vb.) tutarı değiştir.</p></div>`;
  const blocks=months.map(m=>{const l=items.filter(i=>i.m===m);
    const inc=l.reduce((a,i)=>a+(i.k==="t"&&i.t.type==="income"?i.t.amount:0),0);
    const exo=l.reduce((a,i)=>a+(i.k==="e"?i.e.total:i.k==="t"&&i.t.type==="expense"?i.t.amount:0),0);
    const pe=l.reduce((a,i)=>a+(i.k==="e"?pend(i.e):i.k==="s"?pend(i.st):0),0);
    return `<details data-m="${m}" ${monthOpen[m]??(m===cm)?"open":""}><summary><b>${mn(m)}</b><span>Gelir <b class="gr">${fmt(inc)}</b></span><span>Gider <b class="rd">${fmt(exo)}</b></span><span>Net <b>${fmt(inc-exo)}</b></span>${pe>0?`<span class="mu">Bekleyen ortak payı ${fmt(pe)}</span>`:""}</summary>
    <div>${l.length?`<table><tr><th>Tarih<th>Kurum / açıklama<th class="n">Tutar<th class="n">Kasadan${P.map(p=>`<th>${p}`).join("")}<th></tr>${l.map(row).join("")}</table>`:'<p class="mu">Bu ay kayıt yok.</p>'}</div></details>`}).join("");
  return `<div class="card"><h2>Yeni kayıt</h2>
  <div class="warn">Kredi kartı giderleri ekstre ödenene kadar kasayı etkilemez. Kasa / nakit giderleri hemen kasadan düşer; kasada kullanılabilir ${fmt(avail)} var, fazlası 3 ortağa bölünür. Gelir kasaya eklenir.</div>
  <div class="row"><label>Tür<select id="ek"><option value="exp">Gider</option><option value="inc">Gelir</option></select></label>
  <label>Ödeme<select id="ep"><option value="card">Kredi kartı</option><option value="kasa">Kasa / nakit (zaten ödendi)</option></select></label><label>Kurum / kaynak<input id="ei"></label><label>Açıklama<input id="ed"></label>
  <label>Tarih<input id="et" type="date" value="${today()}"></label><label>Tutar (TRY)<input id="ea" inputmode="decimal"></label>
  <button class="b" data-a="addExp">Ekle</button></div></div>${cardPanel}${blocks}`;
}

function vFil(){
  const l=[...S.filaments].sort((a,b)=>(a.color||"").localeCompare(b.color||""));
  const out=l.filter(f=>f.remaining<=0),sw=c=>`<span class="sw" style="background:${esc(c||"#999")}"></span>`;
  return `<div class="card"><h2>Yeni filament</h2>
  <div class="sws">${lib().map(c=>`<button class="cs ${selC?.name===c.name?"sel":""}" title="${esc(c.name)}" style="background:${esc(c.hex)}" data-a="selC" data-n="${esc(c.name)}" data-h="${esc(c.hex)}"></button>`).join("")}</div>
  <p class="mu">Seçilen renk: <b id="cn">${selC?esc(selC.name):"—"}</b> · Listede yoksa Ayarlar sekmesinden renk ekle.</p>
  <div class="row"><label>Malzeme<select id="fm">${types().map(m=>`<option>${m}</option>`).join("")}</select></label><label>Marka<input id="fb"></label>
  <label>Kalan (gram)<input id="fg" inputmode="numeric" value="1000"></label><button class="b" data-a="addFil">Ekle</button></div></div>
  <div class="card"><h2>Stok</h2>${out.length?`<div class="warn">Biten: ${out.map(f=>esc(f.color+" "+f.material)).join(", ")}</div>`:""}
  ${l.length?`<table><tr><th>Renk<th>Malzeme<th class="n">Kalan<th></tr>${l.map(f=>`<tr><td>${sw(f.hex)}${esc(f.color)}<td>${esc(f.material)} <span class="mu">${esc(f.brand)}</span>
  <td class="n ${f.remaining<=0?"rd":""}">${f.remaining<=0?"Bitti":f.remaining+" g"}
  <td><button class="g" data-a="use" data-id="${f.id}">Kullan</button> <button class="g" data-a="add" data-id="${f.id}">Ekle</button> <button class="g" data-a="del" data-c="filaments" data-id="${f.id}">Sil</button></tr>`).join("")}</table>`:'<p class="mu">Henüz filament yok.</p>'}</div>`;
}

function vSet(){
  return `<div class="card"><h2>Tema</h2><div class="row">${[["mavi","Mavimsi"],["koyu","Koyu gri"],["beyaz","Beyaz"]].map(([k,v])=>`<button class="${theme===k?"b":"g"}" data-a="theme" data-k="${k}" style="padding:9px 14px;font:inherit">${v}</button>`).join("")}</div></div>
  <div class="card"><h2>Kasa bakiyesini düzelt</h2><p class="mu">Şu an: <b>${fmt(balance())}</b>. Gerçek tutarı yaz, fark kasaya "manuel düzeltme" olarak işlenir.</p>
  <div class="row"><label>Yeni bakiye (TRY)<input id="sb" inputmode="decimal"></label><button class="b" data-a="setBal">Bakiyeyi ayarla</button></div></div>
  <div class="card"><h2>Filament renk kütüphanesi</h2>
  <div class="row"><label>Renk adı<input id="sn"></label><label>Renk<input id="sh" type="color" value="#1e66d0" style="height:38px;padding:2px"></label><button class="b" data-a="addColor">Renk ekle</button></div>
  <p class="mu">Hazır renkler</p><div class="sws">${DEF.map(c=>`<span class="sw" title="${esc(c.name)}" style="background:${esc(c.hex)};width:22px;height:22px"></span>`).join("")}</div>

      await updateDoc(ref,{["shares."+d.p]:{...s,paid:true,paidDate:today(),mid:m.id}})}
    else{if(s.mid)await deleteDoc(doc(db,"movements",s.mid));await updateDoc(ref,{["shares."+d.p]:{...s,paid:false,paidDate:null,mid:null}})}},
  doPay:async d=>{const x=S.planned.find(y=>y.id===d.id),miss=P.filter(p=>x.shares[p]?.amount>0&&!x.shares[p].paid);
    if(miss.length&&!confirm("Henüz yatırmayanlar var: "+miss.join(", ")+". Yine de ödendi işaretlensin mi?"))return;
    const dt=today(),m=await addDoc(collection(db,"movements"),{date:dt,type:"out",amount:x.amount,plannedId:x.id,note:x.name+" ödemesi"});
    const e=await addDoc(collection(db,"expenses"),{institution:x.name,description:"Planlı ödeme",date:dt,total:x.amount,fromKasa:x.amount,pay:"planned",plannedId:x.id,statementId:"",receipt:"",shares:{}});
    let nextId=null;
    if(x.repeat){const ns={};P.forEach(p=>{const a=x.shares[p]?.amount||0;ns[p]={amount:a,paid:a===0,mid:null,paidDate:null}});
      nextId=(await addDoc(collection(db,"planned"),{name:x.name,amount:x.amount,due:addM(x.due),repeat:true,fromKasa:x.fromKasa||0,shares:ns,paid:false,paidDate:null,mid:null,eid:null,nextId:null})).id}
    await updateDoc(doc(db,"planned",x.id),{paid:true,paidDate:dt,mid:m.id,eid:e.id,nextId})},
  unpayPl:async d=>{const x=S.planned.find(y=>y.id===d.id),nx=x.nextId&&S.planned.find(y=>y.id===x.nextId);
    if(nx&&(nx.paid||P.some(p=>nx.shares?.[p]?.paid&&nx.shares[p].amount>0)))return alert("Sonraki ayın ödemesinde yatırım var, önce onu geri al.");
    if(!confirm("Ödendi işareti geri alınsın mı?"))return;
    if(x.mid)await deleteDoc(doc(db,"movements",x.mid));if(x.eid)await deleteDoc(doc(db,"expenses",x.eid));if(nx)await deleteDoc(doc(db,"planned",nx.id));
    await updateDoc(doc(db,"planned",x.id),{paid:false,paidDate:null,mid:null,eid:null,nextId:null})},
  delPl:async d=>{if(!confirm("Planlı ödeme ve bağlı kasa hareketleri silinsin mi?"))return;
    for(const m of S.movements.filter(m=>m.plannedId===d.id))await deleteDoc(doc(db,"movements",m.id));
    for(const e of S.expenses.filter(e=>e.plannedId===d.id))await deleteDoc(doc(db,"expenses",e.id));
    await deleteDoc(doc(db,"planned",d.id))},
  editC:()=>{editC=!editC;render()},
  show:d=>{shown[d.k]=!shown[d.k];render()},
  copy:async d=>{const v=cv(d.k);try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
    const b=document.querySelector(`[data-a="copy"][data-k="${d.k}"]`);if(b){b.innerHTML=CHK;setTimeout(()=>{if(b.isConnected)b.innerHTML=COPY},1200)}},
  saveC:async()=>{const f={};CF.forEach(([,fs])=>fs.forEach(([k])=>f[k]=val("c_"+k)||""));
    await setDoc(doc(db,"company","info"),{f},{merge:true});editC=false;render()},
  link:async d=>{const cur=d.k==="x"?(cd().docs||[])[+d.i]?.url:(cd().links||{})[d.k];
    const u=prompt(d.l+" için Drive linki:",cur||"");if(u===null)return;const t=u.trim();if(t&&!okUrl(t))return alert("Link http veya https ile başlamalı.");
    if(d.k==="x"){const a=[...(cd().docs||[])];a[+d.i]={...a[+d.i],url:t};await setDoc(doc(db,"company","info"),{docs:a},{merge:true})}
    else await setDoc(doc(db,"company","info"),{links:{[d.k]:t}},{merge:true})},
  addLink:async()=>{const n=prompt("Belge adı:");if(!n||!n.trim())return;const u=(prompt("Drive linki:")||"").trim();if(!okUrl(u))return alert("Link http veya https ile başlamalı.");
    await setDoc(doc(db,"company","info"),{docs:[...(cd().docs||[]),{name:n.trim(),url:u}]},{merge:true})},
  delLink:async d=>{if(!confirm("Belge silinsin mi?"))return;await setDoc(doc(db,"company","info"),{docs:(cd().docs||[]).filter((_,i)=>i!==+d.i)},{merge:true})},
  addType:async()=>{if(!val("tn"))return alert("Tip adı gir.");await addDoc(collection(db,"ftypes"),{name:val("tn")})},
  theme:d=>{theme=d.k;document.documentElement.dataset.theme=theme;try{localStorage.setItem("qotTheme",theme)}catch{}render()},
  addColor:async()=>{if(!val("sn"))return alert("Renk adı gir.");await addDoc(collection(db,"colors"),{name:val("sn"),hex:val("sh")})},
  setBal:async()=>{if(val("sb")==="")return alert("Yeni bakiyeyi yaz.");const t=num("sb"),d=round(t-balance());if(d===0)return;
    await addDoc(collection(db,"movements"),{date:today(),type:d>0?"in":"out",amount:Math.abs(d),note:"Manuel düzeltme (bakiye "+fmt(t)+")"})},
  rcp:async d=>{const e=S.expenses.find(x=>x.id===d.id),l=prompt("Dekont linki (Drive vb.):",e.receipt||"");if(l===null)return;
    await updateDoc(doc(db,"expenses",e.id),{receipt:l.trim()})},
  use:async d=>{const f=S.filaments.find(x=>x.id===d.id),g=parseFloat(prompt("Kaç gram kullanıldı?"));if(!(g>0))return;
    await updateDoc(doc(db,"filaments",f.id),{remaining:Math.max(0,f.remaining-g),logs:arrayUnion({date:today(),g})})},
  add:async d=>{const f=S.filaments.find(x=>x.id===d.id),g=parseFloat(prompt("Kaç gram eklendi? (yeni makara için 1000)"));if(!(g>0))return;
    await updateDoc(doc(db,"filaments",f.id),{remaining:f.remaining+g})},
  del:async d=>{if(confirm("Silinsin mi?"))await deleteDoc(doc(db,d.c,d.id))},
  exp:()=>{const out={format:"qot-v1",exportedAt:new Date().toISOString()};COLS.forEach(c=>out[c]=S[c]);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
    a.download="qot-yedek-"+today()+".json";a.click()}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])Promise.resolve(A[t.dataset.a](t.dataset)).catch(x=>alert("Hata: "+(x.code||x)))});
document.addEventListener("toggle",e=>{const m=e.target.dataset?.m;if(m!==undefined)monthOpen[m]=e.target.open},true);
document.addEventListener("change",async e=>{
  const d=e.target.dataset;
  if(e.target.id?.startsWith("cu_")){const q=document.getElementById("cp_"+e.target.id.slice(3));if(q)q.value=defPU(e.target.value)}
  if(d.mt){try{await updateDoc(doc(db,"materials",d.mt),{[d.f]:d.f==="price"?num2(e.target.value):e.target.value.trim()})}catch(x){alert("Hata: "+(x.code||x))}return}
  if(d.p){const p=S.products.find(x=>x.id===d.p);if(!p)return;
    try{if(d.i!==undefined){const a=(p.comps||[]).map(c=>({...c}));const it=a[+d.i],v=e.target.value.trim();
      if(d.f==="u"&&(!it.pu||it.pu===(it.u||"adet")))it.pu=defPU(v);
      if(d.f==="mid"){const m=S.materials.find(x=>x.id===v);it.mid=v||null;if(m){it.c=m.price;it.pu=m.unit}}
      else it[d.f]=["n","u","pu"].includes(d.f)?v:num2(v);await updateDoc(doc(db,"products",p.id),{comps:a})}
    else await updateDoc(doc(db,"products",p.id),{[d.f]:num2(e.target.value)})}catch(x){alert("Hata: "+(x.code||x))}return}
  if(e.target.id==="tm"){month=e.target.value;render()}
  if(e.target.id==="imp"){const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());if(j.format!=="qot-v1")throw 0;
      for(const c of COLS)for(const {id,...r} of j[c]||[])await setDoc(doc(db,c,id),r);alert("Yedek yüklendi.")}
    catch{alert("Geçersiz dosya. qot-v1 formatında JSON gerekli.")}}
});
</script></body></html>
